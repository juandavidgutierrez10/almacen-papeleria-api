name: Compilar y documentar
on:
  push:
    branches: [main, develop]
  pull_request:
jobs:
  construir:
    runs-on: ubuntu-latest
    env:
      SPRING_PROFILES_ACTIVE: h2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: ./mvnw -B verify
      - run: ./mvnw -B javadoc:javadoc
